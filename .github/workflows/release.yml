name: Release

on:
  push:
    tags:
      - 'v*'

# contents: write — goreleaser creates the GitHub release and uploads assets.
# id-token + attestations: write — SLSA build provenance (#354): the attest
# step signs, via GitHub's OIDC identity (keyless Sigstore), a statement
# binding each artifact's digest to this repo, workflow, and commit. A
# downstream verifier (`gh attestation verify <file> -R jra3/linear-fuse`)
# can then detect a swapped artifact: checksums.txt alone is written by this
# same job, so it authenticates nothing by itself.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest everything a downstream consumer verifies: the release archives,
      # the .deb/.rpm packages, and checksums.txt (the AUR PKGBUILD pins its
      # sha256sums from it; apt/dnf users can `gh attestation verify` the package).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
