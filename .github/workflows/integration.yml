name: Integration Tests (Write)

on:
  workflow_dispatch:
    inputs:
      run_write_tests:
        description: 'Run write tests (creates/modifies Linear data)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration-write:
    name: Integration Tests (Write Operations)
    # The run_write_tests input was declared and read by nothing: the dispatch form
    # asked you to confirm "creates/modifies Linear data" and defaulted to false,
    # then ran the same thing either way. Harmless while the job was accidentally
    # offline (#386) — an unchecked box that writes to a real workspace is not.
    # Gating the job, not the step, so an unchecked run never puts the secret on a
    # runner at all.
    if: ${{ inputs.run_write_tests }}
    runs-on: ubuntu-latest
    # Above the test step's own -timeout, so go test is what expires first and
    # prints a diagnosis rather than the runner killing the job mid-suite.
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      # Replaces an `apt-get install -y fuse3` that was a no-op: fuse3 is
      # preinstalled on GitHub's ubuntu images (the preflight still installs it if
      # a future image drops it). Installing was never the problem — WHICH
      # fusermount3 PATH resolves to is (#384).
      - name: FUSE preflight
        run: ./scripts/ci-fuse-preflight.sh

      - name: Build
        run: make build

      # liveAPIMode is `LINEARFS_LIVE_API=1 && apiKey != ""`, so a missing, empty or
      # renamed secret silently drops this job back to the offline fixture suite,
      # skips all 55 write tests, and exits green under a name that promises it
      # mutated Linear — the same lie #386 fixes, just relocated from the env block
      # to the secret. Fail loud instead.
      - name: Require a live API key
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          [ -n "$LINEAR_API_KEY" ] || { echo "LINEAR_API_KEY secret is empty; the write suite cannot run live"; exit 1; }

      # Both vars are load-bearing and neither is sufficient alone:
      # skipIfNoWriteTests (internal/integration/testdata_test.go) skips on
      # !liveAPIMode BEFORE it consults LINEARFS_WRITE_TESTS. This job used to set
      # only WRITE_TESTS, so all 55 write tests skipped on the first branch and the
      # job ran the offline fixture suite while advertising that it mutates Linear
      # (#386). LINEARFS_INTEGRATION was dropped in the same change: nothing reads it.
      # -timeout matches `make integration-tests-rw`: the live suite's setup gate
      # spends up to a third of it waiting for the cold-start full sync, and the
      # job's own timeout-minutes must stay above the total.
      # LINEARFS_TEST_TEAM names the team the suite mutates. It is a team key, not
      # a credential, so it is a plain value — but it must agree with whatever
      # workspace the LINEAR_API_KEY secret belongs to. A team the key's workspace
      # does not have is a hard setup error listing the teams that were found, not
      # a silent fallback onto teams[0]; repointing the secret at a different
      # workspace without updating this line fails the job loudly, by design.
      - name: Run integration tests (with writes)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEARFS_LIVE_API: "1"
          LINEARFS_WRITE_TESTS: "1"
          LINEARFS_TEST_TEAM: "FUS"
        run: go test -v -timeout 25m ./internal/integration/...

      - name: Cleanup on failure
        if: failure()
        run: |
          fusermount3 -u /tmp/linearfs-test 2>/dev/null || true
