name: Integration Tests (Write)

on:
  workflow_dispatch:
    inputs:
      run_write_tests:
        description: 'Run write tests (creates/modifies Linear data)'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  integration-write:
    name: Integration Tests (Write Operations)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      # Replaces an `apt-get install -y fuse3` that was a no-op: fuse3 is
      # preinstalled on GitHub's ubuntu images (the preflight still installs it if
      # a future image drops it). Installing was never the problem — WHICH
      # fusermount3 PATH resolves to is (#384).
      - name: FUSE preflight
        run: ./scripts/ci-fuse-preflight.sh

      - name: Build
        run: make build

      - name: Run integration tests (with writes)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEARFS_INTEGRATION: "1"
          LINEARFS_WRITE_TESTS: "1"
        run: go test -v -timeout 20m ./internal/integration/...

      - name: Cleanup on failure
        if: failure()
        run: |
          fusermount3 -u /tmp/linearfs-test 2>/dev/null || true
